name: Publish annotation website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable_ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable_ci_password
      PGDATABASE: postgres
      XACL_DISPOSABLE_DATABASE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python scripts/verify_site.py
      - run: python tests/backend_setup.py
      - run: node --check site/app.js && node --check site/cloud.mjs && node --check site/writing-protocol.mjs
      - run: bash scripts/test_database.sh
      - run: python -m pip install "psycopg[binary]==3.2.12"
      - run: python tests/database_upgrade.py
        env:
          QA_DATABASE_URL: postgresql://postgres:disposable_ci_password@localhost:5432/postgres
      - run: python tests/database_concurrency.py
        env:
          QA_DATABASE_URL: postgresql://postgres:disposable_ci_password@localhost:5432/postgres
      - run: python tests/quality_backend_setup.py
      - run: python tests/quality_upgrade.py
        env:
          QA_DATABASE_URL: postgresql://postgres:disposable_ci_password@localhost:5432/postgres
      - run: python tests/writing_backend_setup.py
      - run: python tests/writing_upgrade.py
        env:
          QA_DATABASE_URL: postgresql://postgres:disposable_ci_password@localhost:5432/postgres
      - run: node --test tests/frontend*.mjs
      - run: npm install --prefix .runtime/browser-deps --no-save playwright@1.62.1
      - run: .runtime/browser-deps/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser_writing.cjs
        env:
          QA_DATABASE_URL: postgresql://postgres:disposable_ci_password@localhost:5432/postgres
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/.runtime/browser-deps/node_modules/playwright
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
